# Include inside hindianimezone.fun's existing server block.
# Keep the existing /uploads/ image alias. These longer prefixes take priority.
location ^~ /uploads/hls/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    expires off;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /uploads/videos/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    expires off;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /uploads/downloads/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    expires off;
    add_header Cache-Control "private, no-store" always;
}

# Legacy temporary uploads are never public.
location = /uploads/temp { return 404; }
location ^~ /uploads/temp/ { return 404; }
